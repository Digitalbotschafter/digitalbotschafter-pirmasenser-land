<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Datensicherung auf Smartphone und Tablet</title>

<style>

:root{
    --primary:#0F4C81;
    --secondary:#1D70B8;
    --accent:#D9A520;
    --light:#F8F9FA;
    --dark:#2D3748;
}

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:var(--light);
    color:var(--dark);
    line-height:1.7;
}

.hero{
    background:linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
    );
    color:white;
    padding:5rem 2rem;
}

.container{
    max-width:1200px;
    margin:auto;
}

.chapter{
    color:#FFD700;
    letter-spacing:2px;
    font-weight:bold;
    text-transform:uppercase;
}

.hero h1{
    font-size:3rem;
    margin:1rem 0;
}

section{
    padding:4rem 2rem;
}

.card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:1.5rem;
}

.card{
    background:white;
    border-radius:15px;
    padding:1.5rem;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.tip{
    background:#FFF7DD;
    border-left:6px solid var(--accent);
    padding:1rem;
    border-radius:10px;
}

.remember{
    background:#EAF5EE;
    border-left:6px solid #2E7D32;
    padding:1rem;
    border-radius:10px;
}

.warning{
    background:#FFF4E5;
    border-left:6px solid #E67E22;
    padding:1rem;
    border-radius:10px;
}

</style>

</head>
<body>
<h2>
Möglichkeiten der Datensicherung
</h2>
