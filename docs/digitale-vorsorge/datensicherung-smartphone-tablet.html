:root{
    --primary:#0F4C81;
    --secondary:#1D70B8;
    --accent:#D9A520;
    --light:#F8F9FA;
    --dark:#2D3748;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

        var(--primary),

    );
    color:white;
    padding:2rem 1.5rem;
}

.container{
    max-width:1200px;
    margin:auto;
}

    letter-spacing:2px;
    margin-bottom:1rem;
}

}

.subtitle{
    font-size:1.2rem;
    opacity:0.95;
}

section{
    padding:2rem;
}

h2{
    color:var(--primary);
    margin-bottom:1.5rem;
    line-height:1.2;
}

    gap:1.5rem;
}

}
